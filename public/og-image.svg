<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d12"/>
      <stop offset="50%" stop-color="#141724"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="glow-circle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </linearGradient>

    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>

  <!-- Ambient Glow Elements -->
  <circle cx="200" cy="150" r="300" fill="url(#glow-circle)" filter="url(#blur-glow)"/>
  <circle cx="1050" cy="450" r="350" fill="url(#glow-circle)" filter="url(#blur-glow)"/>

  <!-- Decorative Subtle Grid lines -->
  <path d="M0 120 H1200 M0 240 H1200 M0 360 H1200 M0 480 H1200" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <path d="M200 0 V630 M400 0 V630 M600 0 V630 M800 0 V630 M1000 0 V630" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Central Glass Card Frame -->
  <rect x="80" y="70" width="1040" height="490" rx="32" fill="#181a26" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>

  <!-- Logo Icon Badge -->
  <rect x="140" y="130" width="76" height="76" rx="22" fill="url(#gold-gradient)"/>
  <text x="178" y="180" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="38" font-weight="900" fill="#0c0d12" text-anchor="middle">DE</text>

  <!-- German Flag Minimal Tag -->
  <rect x="236" y="152" width="130" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="301" y="173" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#f59e0b" text-anchor="middle">A1 • B1 • B2</text>

  <!-- Main Headline -->
  <text x="140" y="270" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="56" font-weight="800" fill="#ffffff">
    Deutsch Lernen <tspan fill="url(#gold-gradient)">Plattform</tspan>
  </text>

  <!-- Subtitle -->
  <text x="140" y="325" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
    Interaktiver Wortschatz, Grammatik-Lektionen und gezielte Goethe &amp; ÖSD Prüfungsvorbereitung.
  </text>

  <!-- Feature Chips / Stats Grid -->
  <!-- Chip 1 -->
  <rect x="140" y="380" width="260" height="110" rx="20" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="170" y="425" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="32" font-weight="700" fill="#f59e0b">3.000+</text>
  <text x="170" y="458" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="16" font-weight="500" fill="#cbd5e1">Wortschatz Vokabeln</text>

  <!-- Chip 2 -->
  <rect x="430" y="380" width="260" height="110" rx="20" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="460" y="425" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="32" font-weight="700" fill="#f59e0b">120+</text>
  <text x="460" y="458" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="16" font-weight="500" fill="#cbd5e1">Grammatik Lektionen</text>

  <!-- Chip 3 -->
  <rect x="720" y="380" width="340" height="110" rx="20" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="750" y="425" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="32" font-weight="700" fill="#10b981">Modelltests</text>
  <text x="750" y="458" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="16" font-weight="500" fill="#cbd5e1">B1 &amp; B2 Zertifikat Goethe/ÖSD</text>
</svg>
